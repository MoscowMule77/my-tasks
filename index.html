<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tasks</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #8a93a6;
    --accent: #4f6df5;
    --accent-soft: #eaeefe;
    --line: #e7e9ef;
    --done: #aab2c2;
    --danger: #e35d6a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 18px 40px; }
  .auth-wrap { max-width: 620px; margin: 0 auto; }

  header.app { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  header.app h1 { font-size: 22px; margin: 0; letter-spacing: -0.3px; }
  .who { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .link-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 0; }
  .link-btn:hover { text-decoration: underline; }

  /* Auth */
  .auth-card {
    background: var(--card); border-radius: var(--radius); padding: 28px;
    box-shadow: 0 1px 3px rgba(20,30,60,.06); margin: 40px auto 0; max-width: 520px; text-align: center;
  }
  .auth-card h2 { margin: 0 0 6px; font-size: 20px; }
  .auth-card p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .auth-card input {
    width: 100%; padding: 12px 14px; font-size: 15px; border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 12px; outline: none;
  }
  .auth-card input:focus { border-color: var(--accent); }
  .btn {
    width: 100%; padding: 12px 14px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: #fff; border: none; border-radius: 10px; cursor: pointer;
  }
  .btn:hover { opacity: .92; }
  .btn:disabled { opacity: .5; cursor: default; }
  .note { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .note.ok { color: #2e9e6b; }
  .note.err { color: var(--danger); }

  /* Add row */
  .add-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .add-row input {
    flex: 1; padding: 12px 14px; font-size: 15px; border: 1px solid var(--line);
    border-radius: 10px; outline: none; background: var(--card);
  }
  .add-row input:focus { border-color: var(--accent); }
  .add-row select {
    padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); font-size: 14px; color: var(--text); outline: none; max-width: 150px;
  }
  .add-row button.add {
    padding: 0 18px; background: var(--accent); color: #fff; border: none;
    border-radius: 10px; font-size: 20px; cursor: pointer; line-height: 1;
  }

  /* List chips + manage */
  .lists-bar { display: flex; align-items: center; gap: 8px; margin: 16px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
  .chip {
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); font-size: 13px; cursor: pointer; color: var(--muted);
  }
  .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip[draggable="true"] { user-select: none; }
  .chip.dragging { opacity: .45; }
  .chip.drop-target { border-color: var(--accent); border-style: dashed; }
  .manage-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .manage-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* Manage lists panel */
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 16px;
  }
  .panel h3 { margin: 0 0 10px; font-size: 14px; }
  .list-edit { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .list-edit input {
    flex: 1; padding: 8px 10px; font-size: 14px; border: 1px solid var(--line);
    border-radius: 8px; outline: none;
  }
  .list-edit input:focus { border-color: var(--accent); }
  .icon-btn { background: none; border: none; cursor: pointer; font-size: 15px; color: var(--muted); padding: 4px 6px; }
  .icon-btn:hover { color: var(--accent); }
  .icon-btn:disabled { opacity: .25; cursor: default; }
  .list-edit .icon-btn:last-of-type:hover { color: var(--danger); }
  .new-list-row { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .new-list-row input {
    flex: 1; padding: 8px 10px; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  .new-list-row button {
    padding: 0 14px; background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
  }

  /* Task list */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .task {
    display: flex; align-items: center; gap: 12px; background: var(--card);
    border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 2px rgba(20,30,60,.04);
  }
  .check {
    width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line);
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .check.on { background: var(--accent); border-color: var(--accent); }
  .check.on::after { content: "✓"; color: #fff; font-size: 14px; }
  .task .title { flex: 1; font-size: 15px; }
  .task.done .title { color: var(--done); text-decoration: line-through; }
  .task .cat {
    font-size: 11px; color: var(--muted); background: var(--bg);
    padding: 3px 9px; border-radius: 999px; flex-shrink: 0;
  }
  .task .cat-select {
    font-size: 11px; color: var(--muted); background: var(--bg);
    border: 1px solid var(--line); padding: 3px 6px; border-radius: 999px;
    flex-shrink: 0; max-width: 120px; cursor: pointer; outline: none;
  }
  .task .cat-select:hover { border-color: var(--accent); color: var(--accent); }
  .del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 17px; flex-shrink: 0; padding: 2px 4px; }
  .del:hover { color: var(--danger); }

  .empty { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 14px; }
  .hidden { display: none !important; }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }

  /* Board (kanban) */
  .board { display: flex; gap: 14px; align-items: flex-start; overflow-x: auto; padding-bottom: 12px; }
  .column {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    width: 270px; min-width: 270px; display: flex; flex-direction: column;
    max-height: calc(100vh - 170px);
  }
  .column.drop-target { border-color: var(--accent); border-style: dashed; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; cursor: grab; }
  .col-head:active { cursor: grabbing; }
  .col-head.dragging { opacity: .5; }
  .col-head .col-name { font-weight: 600; font-size: 15px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-head .col-count { font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 1px 9px; flex-shrink: 0; }
  .col-head .grip { color: var(--line); font-size: 13px; flex-shrink: 0; }
  .col-cards { display: flex; flex-direction: column; gap: 8px; padding: 4px 10px 6px; overflow-y: auto; flex: 1; min-height: 8px; }
  .col-empty { color: var(--muted); font-size: 13px; padding: 10px 4px; text-align: center; }
  .card {
    display: flex; flex-direction: column; gap: 7px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; cursor: grab;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .5; }
  .card-main { display: flex; align-items: flex-start; gap: 10px; }
  .card .check { width: 20px; height: 20px; margin-top: 1px; }
  .card .title { flex: 1; font-size: 14px; }
  .card.done .title { color: var(--done); text-decoration: line-through; }
  .card .del { font-size: 15px; margin-top: -1px; }
  .move-select {
    align-self: flex-start; font-size: 11px; color: var(--muted); background: var(--card);
    border: 1px solid var(--line); border-radius: 7px; padding: 2px 5px; cursor: pointer; outline: none; max-width: 100%;
  }
  .move-select:hover { border-color: var(--accent); color: var(--accent); }
  .col-add { padding: 6px 10px 12px; }
  .col-add input {
    width: 100%; padding: 9px 11px; font-size: 14px; border: 1px solid var(--line);
    border-radius: 9px; outline: none; background: var(--card);
  }
  .col-add input:focus { border-color: var(--accent); }
  .add-column-btn {
    min-width: 200px; align-self: stretch; border: 1.5px dashed var(--line); background: transparent;
    color: var(--muted); border-radius: 14px; padding: 14px; cursor: pointer; font-size: 14px; white-space: nowrap;
  }
  .add-column-btn:hover { border-color: var(--accent); color: var(--accent); }

  .setup-banner {
    background: #fff7e6; border: 1px solid #ffe2a8; color: #8a6100;
    border-radius: 12px; padding: 14px 16px; font-size: 13px; margin-bottom: 18px;
  }
  .setup-banner code { background: #fff0cc; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

  </script>
  <!-- ================================================= -->

  <div id="setupBanner" class="setup-banner hidden">
    ⚙️ <strong>Almost there.</strong> Open this file and paste your Supabase

  <!-- Auth view -->
  <div id="authView" class="hidden">

      <h2>My Tasks</h2>
      <p>Sign in, or create an account to get started.</p>
      <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">

  <!-- App view -->

    <!-- Manage lists panel (hidden by default) -->
    <div class="panel hidden" id="managePanel">
      <h3>Your lists</h3>

      </div>

    <!-- Kanban board: one column per list -->
    <div class="board" id="board"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  let supa = null;
  let user = null;
  let tasks = [];
  let lists = [];           // [{id, name, ...}]
  let activeFilter = "All"; // "All" or a list id
  let managing = false;

  const $ = (id) => document.getElementById(id);

  // --- Check config ---
  const configured = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;
  if (!configured) {
    $("setupBanner").classList.remove("hidden");
    $("authView").classList.remove("hidden");
    $("sendLinkBtn").disabled = true;
    $("authNote").textContent = "Add your Supabase keys to enable sign-in.";
    $("authNote").className = "note err";
    return;
  }

  supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // --- Auth ---
  async function init() {
    const { data } = await supa.auth.getSession();
    setUser(data.session ? data.session.user : null);
    supa.auth.onAuthStateChange((_e, session) => setUser(session ? session.user : null));
  }

  function setUser(u) {
    user = u;
    if (user) {
      $("authView").classList.add("hidden");
      $("appView").classList.remove("hidden");
      $("appHeader").classList.remove("hidden");
      $("whoEmail").textContent = user.email;
      loadAll();
    } else {
      $("authView").classList.remove("hidden");
      $("appView").classList.add("hidden");
      $("appHeader").classList.add("hidden");
    }
  }

  async function doSignIn() {
    const email = $("emailInput").value.trim();
    const password = $("passwordInput").value;
    const note = $("authNote");
    if (!email || !password) { note.textContent = "Enter your email and password."; note.className = "note err"; return; }
    $("signInBtn").disabled = true;
    note.textContent = "Signing in…"; note.className = "note";
    const { error } = await supa.auth.signInWithPassword({ email, password });
    $("signInBtn").disabled = false;
    if (error) {
      note.textContent = error.message.includes("Invalid login")
        ? "Wrong email or password. New here? Tap \"Create an account\"."
        : error.message;
      note.className = "note err";
    }
  }

  async function doSignUp() {
    const email = $("emailInput").value.trim();
    const password = $("passwordInput").value;
    const note = $("authNote");
    if (!email || !password) { note.textContent = "Enter an email and a password (6+ characters)."; note.className = "note err"; return; }
    if (password.length < 6) { note.textContent = "Password must be at least 6 characters."; note.className = "note err"; return; }
    $("createBtn").disabled = true;
    note.textContent = "Creating your account…"; note.className = "note";
    const { data, error } = await supa.auth.signUp({ email, password });
    $("createBtn").disabled = false;
    if (error) { note.textContent = error.message; note.className = "note err"; return; }
    if (!data.session) {
      note.textContent = "Account created — now tap \"Sign in\".";
      note.className = "note ok";
    }
    // If a session is returned (email confirmation off), onAuthStateChange logs you straight in.
  }

  $("signInBtn").addEventListener("click", doSignIn);
  $("createBtn").addEventListener("click", doSignUp);
  $("passwordInput").addEventListener("keydown", (e) => { if (e.key === "Enter") doSignIn(); });
  $("emailInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("passwordInput").focus(); });
  $("logoutBtn").addEventListener("click", async () => { await supa.auth.signOut(); });

  // --- Load lists + tasks ---
  async function loadAll() {
    await loadLists();
    // First-time users get a starter list so the app is usable right away.
    if (lists.length === 0) {
      await createList("Personal", true);
      await loadLists();
    }
    await loadTasks();
  }

  async function loadLists() {
    const { data, error } = await supa
      .from("lists").select("*")
      .order("position", { ascending: true, nullsFirst: false })
      .order("created_at", { ascending: true });
    if (error) { console.error(error); return; }
    lists = data || [];
  }

  async function loadTasks() {
    const { data, error } = await supa
      .from("todos").select("*").order("created_at", { ascending: false });
    if (error) { console.error(error); return; }
    tasks = data || [];
    render();
  }

  // --- List operations ---
  async function createList(name, silent) {
    const clean = (name || "").trim();
    if (!clean) return;
    const maxPos = lists.reduce((m, l) => Math.max(m, l.position || 0), 0);
    const { data, error } = await supa.from("lists").insert({ name: clean, position: maxPos + 1 }).select().single();
    if (error) { console.error(error); if (!silent) alert("Could not add list: " + error.message); return; }
    lists.push(data);
    if (!silent) render();
  }

  // Re-number positions to match the current array order, and save to Supabase.
  function persistPositions() {
    lists.forEach((l, i) => { l.position = i + 1; });
    lists.forEach((l) => {
      supa.from("lists").update({ position: l.position }).eq("id", l.id)
        .then(({ error }) => { if (error) console.error(error); });
    });
  }

  // Move a list up (dir = -1) or down (dir = +1) — used by the arrow buttons.
  function moveList(id, dir) {
    const i = lists.findIndex((x) => x.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= lists.length) return;
    const tmp = lists[i]; lists[i] = lists[j]; lists[j] = tmp;
    persistPositions();
    render();
  }

  // Drop list `fromId` at the position of `toId` — used by drag and drop.
  function reorderListByDrag(fromId, toId) {
    if (!fromId || fromId === toId) return;
    const from = lists.findIndex((x) => x.id === fromId);
    const to = lists.findIndex((x) => x.id === toId);
    if (from < 0 || to < 0) return;
    const [moved] = lists.splice(from, 1);
    lists.splice(to, 0, moved);
    persistPositions();
    render();
  }

  async function renameList(id, name) {
    const clean = (name || "").trim();
    if (!clean) return;
    const l = lists.find((x) => x.id === id);
    if (l) l.name = clean;
    const { error } = await supa.from("lists").update({ name: clean }).eq("id", id);
    if (error) { console.error(error); loadAll(); }
  }

  async function deleteList(id) {
    const l = lists.find((x) => x.id === id);
    const taskCount = tasks.filter((t) => t.list_id === id).length;
    const msg = taskCount > 0
      ? `Delete "${l ? l.name : "this list"}" and its ${taskCount} task(s)?`
      : `Delete "${l ? l.name : "this list"}"?`;
    if (!confirm(msg)) return;
    lists = lists.filter((x) => x.id !== id);
    tasks = tasks.filter((t) => t.list_id !== id); // server cascade-deletes these
    if (activeFilter === id) activeFilter = "All";
    render();
    const { error } = await supa.from("lists").delete().eq("id", id);
    if (error) { console.error(error); loadAll(); }
  }

  // --- Task operations ---
  async function addTaskToList(listId, inputEl) {
    const title = inputEl.value.trim();
    if (!title || !listId) return;
    inputEl.value = "";
    const { data, error } = await supa
      .from("todos").insert({ title, list_id: listId, done: false }).select().single();
    if (error) { console.error(error); alert("Could not add task: " + error.message); return; }
    tasks.unshift(data);
    render();
    // keep focus in the same column's input for fast entry
    const again = document.querySelector('.col-add input[data-list="' + listId + '"]');
    if (again) again.focus();
  }

  async function toggleTask(t) {
    const newDone = !t.done;
    t.done = newDone;
    render();
    const { error } = await supa.from("todos").update({ done: newDone }).eq("id", t.id);
    if (error) { console.error(error); t.done = !newDone; render(); }
  }

  async function deleteTask(t) {
    tasks = tasks.filter((x) => x.id !== t.id);
    render();
    const { error } = await supa.from("todos").delete().eq("id", t.id);
    if (error) { console.error(error); loadTasks(); }
  }

  // Move a task to a different list.
  async function reassignTask(t, newListId) {
    if (!newListId || newListId === t.list_id) return;
    const prev = t.list_id;
    t.list_id = newListId;
    render();
    const { error } = await supa.from("todos").update({ list_id: newListId }).eq("id", t.id);
    if (error) { console.error(error); t.list_id = prev; render(); alert("Could not move task: " + error.message); }
  }

  $("manageBtn").addEventListener("click", () => { managing = !managing; render(); });
  $("addListBtn").addEventListener("click", async () => {
    await createList($("newListInput").value);
    $("newListInput").value = "";
  });
  $("newListInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("addListBtn").click(); });

  function listName(id) {
    const l = lists.find((x) => x.id === id);
    return l ? l.name : "—";
  }

  // --- Render ---
  function render() {
    renderManagePanel();
    renderBoard();
  }

  function renderManagePanel() {
    const panel = $("managePanel");
    panel.classList.toggle("hidden", !managing);
    if (!managing) return;
    const box = $("listEdits");
    box.innerHTML = "";
    if (lists.length === 0) {
      box.innerHTML = '<div style="color:var(--muted);font-size:13px;">No lists yet — add one below.</div>';
    }
    lists.forEach((l, idx) => {
      const row = document.createElement("div");
      row.className = "list-edit";
      const up = document.createElement("button");
      up.className = "icon-btn"; up.innerHTML = "▲"; up.title = "Move up";
      up.disabled = idx === 0;
      up.addEventListener("click", () => moveList(l.id, -1));
      const down = document.createElement("button");
      down.className = "icon-btn"; down.innerHTML = "▼"; down.title = "Move down";
      down.disabled = idx === lists.length - 1;
      down.addEventListener("click", () => moveList(l.id, 1));
      const inp = document.createElement("input");
      inp.value = l.name;
      inp.addEventListener("change", () => renameList(l.id, inp.value));
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") inp.blur(); });
      const del = document.createElement("button");
      del.className = "icon-btn";
      del.innerHTML = "🗑";
      del.title = "Delete list";
      del.addEventListener("click", () => deleteList(l.id));
      row.append(up, down, inp, del);
      box.appendChild(row);
    });
  }

  function renderBoard() {
    const board = $("board");
    board.innerHTML = "";

    lists.forEach((l) => {
      const col = document.createElement("div");
      col.className = "column";
      // Accept dropped cards (move task here) and dropped columns (reorder).
      col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("drop-target"); });
      col.addEventListener("dragleave", () => col.classList.remove("drop-target"));
      col.addEventListener("drop", (e) => {
        e.preventDefault();
        col.classList.remove("drop-target");
        const data = e.dataTransfer.getData("text/plain");
        if (data.startsWith("card:")) {
          const t = tasks.find((x) => x.id === data.slice(5));
          if (t) reassignTask(t, l.id);
        } else if (data.startsWith("col:")) {
          reorderListByDrag(data.slice(4), l.id);
        }
      });

      // Header (drag handle for reordering columns)
      const head = document.createElement("div");
      head.className = "col-head";
      head.draggable = true;
      head.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", "col:" + l.id); e.dataTransfer.effectAllowed = "move"; head.classList.add("dragging"); });
      head.addEventListener("dragend", () => head.classList.remove("dragging"));
      const grip = document.createElement("span"); grip.className = "grip"; grip.textContent = "⠿";
      const name = document.createElement("span"); name.className = "col-name"; name.textContent = l.name;
      const colTasks = tasks.filter((t) => t.list_id === l.id);
      const count = document.createElement("span"); count.className = "col-count"; count.textContent = colTasks.length;
      head.append(grip, name, count);

      // Cards
      const cards = document.createElement("div");
      cards.className = "col-cards";
      if (colTasks.length === 0) {
        const e = document.createElement("div"); e.className = "col-empty"; e.textContent = "No tasks yet";
        cards.appendChild(e);
      }
      colTasks.forEach((t) => {
        const card = document.createElement("div");
        card.className = "card" + (t.done ? " done" : "");
        card.draggable = true;
        card.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", "card:" + t.id); e.dataTransfer.effectAllowed = "move"; e.stopPropagation(); card.classList.add("dragging"); });
        card.addEventListener("dragend", () => card.classList.remove("dragging"));

        const main = document.createElement("div");
        main.className = "card-main";
        const check = document.createElement("div");
        check.className = "check" + (t.done ? " on" : "");
        check.addEventListener("click", () => toggleTask(t));
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = t.title;
        const del = document.createElement("button");
        del.className = "del";
        del.innerHTML = "✕";
        del.title = "Delete";
        del.addEventListener("click", () => deleteTask(t));
        main.append(check, title, del);
        card.appendChild(main);

        // Mobile-friendly move control (drag works on desktop).
        if (lists.length > 1) {
          const mv = document.createElement("select");
          mv.className = "move-select";
          mv.title = "Move to another list";
          const ph = document.createElement("option");
          ph.value = ""; ph.textContent = "Move to…";
          mv.appendChild(ph);
          lists.filter((x) => x.id !== l.id).forEach((x) => {
            const o = document.createElement("option");
            o.value = x.id; o.textContent = "→ " + x.name;
            mv.appendChild(o);
          });
          mv.addEventListener("change", () => { if (mv.value) reassignTask(t, mv.value); });
          card.appendChild(mv);
        }

        cards.appendChild(card);
      });

      // Add-task input for this column
      const addWrap = document.createElement("div");
      addWrap.className = "col-add";
      const inp = document.createElement("input");
      inp.type = "text";
      inp.placeholder = "+ Add a task";
      inp.setAttribute("data-list", l.id);
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") addTaskToList(l.id, inp); });
      addWrap.appendChild(inp);

      col.append(head, cards, addWrap);
      board.appendChild(col);
    });

    // "Add list" button at the end of the board
    const addCol = document.createElement("button");
    addCol.className = "add-column-btn";
    addCol.textContent = "+ Add list";
    addCol.addEventListener("click", async () => {
      const name = prompt("New list name:");
      if (name && name.trim()) await createList(name);
    });
    board.appendChild(addCol);
  }

  init();
})();
</script>
</body>
</html>
